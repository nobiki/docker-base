networks:
  selenium-base-net:
    driver: bridge
    name: selenium-base-net
    external: true

services:
  selenium-hub:
    container_name: selenium-hub
    hostname: selenium-hub
    image: selenium/hub:latest
    environment:
      - TZ=Asia/Tokyo
      - GRID_BROWSER_TIMEOUT=30
      - GRID_TIMEOUT=30
      - GRID_MAX_SESSION=10
    ports:
      - 4000:4444
    networks:
      selenium-base-net:
        aliases:
          - hub
