networks:
  selenium-base-net:
    driver: bridge
    name: selenium-base-net
    external: true

services:

  node-chrome:
    image: node-chrome:latest
    build:
      context: ./dockerfile/
      dockerfile: node-chrome.Dockerfile
    env_file: ../environments/node-chrome.env
    networks:
      selenium-base-net:
        aliases:
          - node-chrome

